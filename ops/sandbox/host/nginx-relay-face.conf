# 릴레이 얼굴 전용 문 (2026-07-31, 현준-4)
#
# 왜 따로 여나: 봇은 내부 서비스(8000 등)에 못 닿게 막아 뒀다. 그 차단은 유지해야 한다 -
# 봇이 murmur API 전체에 닿으면 격리가 무너진다. 그런데 릴레이로 도는 봇은 그 얼굴 하나는
# 불러야 한다.
#
# 그래서 포트를 따로 내고 **그 경로 하나만** 통과시킨다. 나머지는 전부 404다.
# 경로 필터는 nftables가 못 하고 nginx가 한다 - 그래서 방화벽이 아니라 여기가 맡는다.
#
# 설치: /etc/nginx/conf.d/ 에 두고 nginx -t 후 reload.
server {
    listen 127.0.0.1:8004;
    server_name _;

    # 프롬프트가 실려 오가므로 로그에 본문을 남기지 않는다.
    access_log off;

    location ~ ^/api/relay/[0-9]+/v1/chat/completions$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # 사람이 답하면 몇 분이 걸린다 - 얼굴 쪽 마감(설정)이 먼저 끝나도록 넉넉히.
        proxy_read_timeout 3900s;
        proxy_send_timeout 3900s;
    }

    location / { return 404; }
}
