# 봇 egress 관문 (2026-07-30, 현준-4)
#
# 왜: 봇이 임의 IP로 작품 파일을 내보낼 수 있었다(실측: 외부 IP 301, POST 통함). 판별 uid가
# 생겨 봇 트래픽만 가릴 수 있게 됐으므로, 봇의 직접 외부 연결은 방화벽이 막고 나가는 길은
# 이 관문 하나로 모은다. 목적지는 허용 목록으로만 통과한다(기본 거부).
#
# 도메인 기준인 이유: 패키지 레지스트리가 CDN이라 IP 허용목록은 계속 깨진다.
# 프록시를 안 쓰는 도구는 방화벽에 막혀 실패한다 — 그것이 기본 거부의 의도다.

User tinyproxy
Group tinyproxy

# 봇은 loopback으로만 나올 수 있다(방화벽) — 관문도 loopback에만 선다.
Listen 127.0.0.1
Port 8118

Timeout 600
MaxClients 40
StartServers 2
MinSpareServers 2
MaxSpareServers 6

LogLevel Warning
PidFile "/run/tinyproxy/tinyproxy.pid"

# 이 호스트 안에서만 쓴다.
Allow 127.0.0.1

# ── 목적지 허용 목록 ─────────────────────────────────────────
# FilterDefaultDeny: 목록에 없으면 거부. 이 줄이 정책의 핵심이다.
Filter "/etc/tinyproxy/organt-egress-allow.txt"
FilterExtended On
FilterDefaultDeny Yes
FilterCaseSensitive Off

# CONNECT(https)로 나갈 수 있는 포트 — 443만. 임의 포트로 터널을 파지 못하게 한다.
ConnectPort 443
