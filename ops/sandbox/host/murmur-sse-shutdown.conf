# SSE 종료 지연 수선 (2026-07-31, 현준-4)
#
# SSE는 연결이 오래 열려 있어 uvicorn이 종료 때 그것들을 기다린다. 기본 90초 뒤 systemd가
# SIGKILL로 끊었고(실측: Failed with result timeout, status=9/KILL), 착지가 그 90초 창에
# 걸리면 verify가 murmur-sse를 죽은 것으로 보고 롤백했다.
#
# 스트림은 끊겨도 클라이언트가 다시 붙는다 - 기다릴 이유가 없다. 종료 상한을 10초로
# 줄이고 uvicorn에도 우아한 종료 상한을 준다.
[Service]
TimeoutStopSec=10
ExecStart=
ExecStart=/root/murmur-stack/.venv/bin/uvicorn config.asgi:application --host 127.0.0.1 --port 8002 --workers 1 --timeout-keep-alive 65 --timeout-graceful-shutdown 5
