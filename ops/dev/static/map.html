<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>지도 — dev</title>
<script src="../../static/vendor/d3.v7.min.js"></script>
<style>
:root{--bg:#0d0d12;--bg2:#16161d;--line:#26262f;--text:#e8e8ef;--text2:#b9b9c6;--text3:#8b8b99;--accent:#7b78f0;--ok:#3f8f5f;--warn:#c9a86a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,'Apple SD Gothic Neo',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 4px;flex-wrap:wrap}
h1{margin:0;font-size:16px}
h1 a{color:var(--text3);text-decoration:none;font-weight:400}
.meta{font-size:11.5px;color:var(--text3)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=text]{width:170px;padding:6px 10px;font-size:12.5px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text)}
button{padding:6px 10px;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text2);cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
#viewbar{display:flex;gap:6px;align-items:center;padding:4px 16px 8px;flex-wrap:wrap}
.vchip{padding:5px 12px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);color:var(--text2);cursor:pointer}
.vchip.on{border-color:var(--accent);color:var(--accent)}
.vchip .n{opacity:.6;font-size:10.5px}
#wrap{position:relative;flex:1;min-height:0;margin:0 16px 12px;border:1px solid var(--line);border-radius:12px;background:#101016;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
.lane-line{stroke:var(--line);stroke-dasharray:3 6}
.lane-name{font-size:12px;font-weight:700;fill:var(--text3);letter-spacing:.06em;cursor:text}
.nd{cursor:grab}
.nd rect{stroke-width:1.4;fill:#171720}
.nd.t-concept rect{fill:#171722;stroke:var(--accent);stroke-width:1.7}
.nd.origin-user.sel rect,.nd.sel rect{stroke-width:2.6;fill:rgba(123,120,240,.15)}
.nd.rel rect{fill:rgba(123,120,240,.09)}
.nd.faded{opacity:.14}
.nd:hover rect{filter:brightness(1.35)}
.nd .nm{fill:var(--text);pointer-events:none}
.nd.t-concept .nm{font-size:13px;font-weight:700}
.nd .st{font-size:9.5px;fill:var(--text3);pointer-events:none}
.nd .nm{font-size:10.5px}
g.far .nd:not(.t-concept) .nm{display:none}
.ed{fill:none;pointer-events:none}
.ed.scan{stroke:#8b8b99;stroke-opacity:.14;stroke-width:1}
.ed.user{stroke:var(--accent);stroke-opacity:.55;stroke-width:1.6}
.ed.agg{stroke:#8b8b99;stroke-opacity:.28}
.ed.hot{stroke:var(--accent);stroke-opacity:.95;stroke-width:1.9}
.ed.faded{stroke-opacity:.04}
.edlb{font-size:10.5px;fill:var(--text2);paint-order:stroke;stroke:#101016;stroke-width:3px;pointer-events:none}
.edlb.faded{opacity:.08}
.area-lb{font-size:14px;font-weight:800;opacity:.85}
#panel{position:absolute;top:10px;right:10px;width:312px;max-height:calc(100% - 20px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
#panel .head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;gap:8px}
#panel .path{font-size:11px;color:var(--text3);margin:2px 0 8px;word-break:break-all}
#panel .doc{font-size:12.5px;color:var(--text2);margin:0 0 8px;white-space:pre-wrap}
#panel .t{font-size:11px;font-weight:700;color:var(--text3);margin:9px 0 4px}
#panel a{display:block;font-size:11.5px;color:var(--text2);padding:2px 0;cursor:pointer;word-break:break-all;text-decoration:none}
#panel a:hover{color:var(--accent)}
#panel .x{background:none;border:none;font-size:15px;color:var(--text3);cursor:pointer;padding:0}
#panel input,#panel textarea,#panel select{width:100%;padding:5px 8px;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--text);margin:2px 0 6px}
#panel textarea{height:52px;resize:vertical;font-family:inherit}
#panel .lbl{font-size:10.5px;color:var(--text3)}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#panel .erow{display:flex;gap:6px;align-items:center;font-size:11.5px;margin:2px 0}
#panel .erow span{flex:1;word-break:break-all}
#legend{position:absolute;left:10px;bottom:10px;background:rgba(13,13,18,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--text2);max-width:340px}
#legend b{color:var(--text)}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--warn);border-radius:9px;padding:6px 14px;font-size:12px;display:none;z-index:5}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--ok);border-radius:9px;padding:6px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3)}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:baseline;gap:10px">
    <h1><a href="../../">프로젝트</a> › <span id="pname">지도</span></h1>
    <span class="meta" id="meta">로딩…</span>
  </div>
  <div class="tools">
    <input id="q" type="text" placeholder="검색(이름·경로)" />
    <button id="fit">전체 보기</button>
    <button id="scanBtn" title="루트 재스캔 → 파일 노드 동기">재스캔</button>
    <a href="./feedback"><button>백로그</button></a>
  </div>
</header>
<div id="viewbar"></div>
<div id="wrap">
  <svg id="svg"></svg>
  <div id="empty"></div>
  <aside id="panel"></aside>
  <div id="legend"></div>
  <div id="banner"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const M=location.pathname.match(/^(.*?)p\/([^/]+)\/$/)
const BASE=M?M[1]:'/', SLUG=M?M[2]:''
window.FB_SERVICE=SLUG||'dev'
window.FB_API=BASE+'api/feedback/'
</script>
<script src="../../static/fb.js" onerror="this.remove()"></script>
<script>
/* ══ 상태·유틸 ══ */
const S={view:null,sel:null,q:'',linkFrom:null}
let G=null            // {nodes, edges, views} — 서버 그래프(정본)
const byN={}
const domId=(nid)=>'n-'+nid.replace(/[^a-zA-Z0-9]+/g,'-')
const T={get(){let t=localStorage.getItem('organt_token');if(!t){t=prompt('admin 토큰(organt_token)');if(t)localStorage.setItem('organt_token',t)}return t||''}}
const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:{'Authorization':'Token '+T.get(),'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.status===204?null:r.json()}
const P=(path,m,b)=>api(`${BASE}api/projects/${SLUG}${path}`,m,b)
const toast=(m)=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
const esc=(s)=>String(s??'').replace(/</g,'&lt;')
const svg=d3.select('#svg'), root=svg.append('g')
const pinsKick=()=>{window.FBPins&&FBPins.refresh()}
const zoom=d3.zoom().scaleExtent([0.22,3]).on('zoom',ev=>{root.attr('transform',ev.transform);root.classed('far',ev.transform.k<0.62);pinsKick()})
svg.call(zoom).on('dblclick.zoom',null)
const HH=(s)=>{let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return (x>>>0)/4294967296}

/* ══ 뷰(레이어 = 데이터) ══ */
const curView=()=>G.views.find(v=>v.vid===S.view)||{vid:'all',name:'전체',types:[],lanes:[]}
const inView=(n,v)=>!v.types.length||v.types.includes(n.type)
function viewbar(){
  const vb=d3.select('#viewbar')
  const chips=G.views.map(v=>{
    const c=G.nodes.filter(n=>inView(n,v)).length
    return `<span class="vchip ${S.view===v.vid?'on':''}" data-v="${v.vid}">${esc(v.name)} <span class="n">${c}</span></span>`}).join('')
  vb.html(chips+` <button id="vAdd" title="새 뷰(레이어) 만들기">+ 뷰</button> <button id="vEdit" title="현재 뷰 설정(이름·타입·레인)">뷰 설정</button> <button id="nAdd" title="현재 뷰 타입의 노드 추가 (캔버스 더블클릭도 됨)">+ 노드</button>`)
  vb.selectAll('.vchip').on('click',function(){S.view=this.dataset.v;S.sel=null;render();panel()})
  vb.select('#vAdd').on('click',async()=>{
    const name=prompt('뷰 이름');if(!name)return
    const types=(prompt('포함할 노드 타입(쉼표, 비우면 전체)\\n지금 있는 타입: '+[...new Set(G.nodes.map(n=>n.type))].join(', '))||'').split(',').map(s=>s.trim()).filter(Boolean)
    const lanes=(prompt('레인(열) 이름들(쉼표, 비우면 자유 배치)')||'').split(',').map(s=>s.trim()).filter(Boolean)
    try{const v=await P('/views/','POST',{name,types,lanes});await reload(false);S.view=v.vid;render()}catch(e){alert(e.message)}})
  vb.select('#vEdit').on('click',async()=>{
    const v=curView()
    const name=prompt('뷰 이름',v.name);if(name===null)return
    const types=(prompt('포함 타입(쉼표, 비우면 전체)',v.types.join(', '))||'').split(',').map(s=>s.trim()).filter(Boolean)
    const lanes=prompt('레인(쉼표, 비우면 자유 배치)',v.lanes.join(', '))
    try{await P(`/views/${v.vid}/`,'PATCH',{name,types,lanes:(lanes||'').split(',').map(s=>s.trim()).filter(Boolean)})
      if(confirm('이 뷰를 삭제할까? (취소=유지)')===true&&G.views.length>1){await P(`/views/${v.vid}/`,'DELETE');S.view=null}
      await reload(false);render()}catch(e){alert(e.message)}})
  vb.select('#nAdd').on('click',()=>createNodeAt())
}

/* ══ 렌더 — 레인 뷰(축) / 자유 뷰(force) ══ */
let sim=null
function visNodes(){const v=curView();return G.nodes.filter(n=>inView(n,v))}
function visEdges(vis){const s=new Set(vis.map(n=>n.nid))
  return G.edges.filter(e=>s.has(e.s)&&s.has(e.t))}
function aggEdges(vis){ // 개념 globs → 파일 import 자동 집계(뷰에 파일이 없을 때 개념 사이 회색 선)
  const cs=vis.filter(n=>n.type==='concept'&&(n.meta.globs||[]).length)
  if(!cs.length)return []
  const of=(fid)=>{let b=null,l=-1;cs.forEach(c=>(c.meta.globs||[]).forEach(g=>{if(fid.startsWith(g)&&g.length>l){b=c.nid;l=g.length}}));return b}
  const agg={}
  G.edges.filter(e=>e.origin==='scan').forEach(e=>{
    const a=of(e.s.slice(2)),b=of(e.t.slice(2))
    if(a&&b&&a!==b){const k=a+'→'+b;agg[k]=(agg[k]||0)+1}})
  return Object.entries(agg).map(([k,n])=>{const [s,t]=k.split('→')
    return {id:'agg'+k,s,t,label:'import '+n,origin:'agg',n}})
}
function edgeD(e){const a=byN[e.s],b=byN[e.t]
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,bow=Math.min(d*.13,38)
  return `M ${a.x} ${a.y} Q ${(a.x+b.x)/2-dy/d*bow} ${(a.y+b.y)/2+dx/d*bow} ${b.x} ${b.y}`}
const lbPos=(e)=>{const a=byN[e.s],b=byN[e.t]
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,bow=Math.min(d*.13,38)
  return [(a.x+b.x)/2-dy/d*bow*.7,(a.y+b.y)/2+dx/d*bow*.7-3]}
const W_=(n)=>n.type==='concept'?176:Math.min(Math.max(n.name.length*6.1+16,42),150)
const H_=(n)=>n.type==='concept'?52:22

function render(){
  if(sim){sim.stop();sim=null}
  root.selectAll('*').remove()
  document.getElementById('empty').style.display='none'
  viewbar();legend()
  const v=curView(), vis=visNodes()
  const r=svg.node().getBoundingClientRect()
  if(!vis.length){const e=document.getElementById('empty');e.style.display='flex'
    e.innerHTML=`<div>'${esc(v.name)}' 뷰에 노드가 없다.</div><button class="on" onclick="createNodeAt()">+ 노드 만들기</button>`
    if(!G.nodes.some(n=>n.type==='file'))e.innerHTML+=`<button onclick="doScan()">스캔으로 파일 채우기</button>`
    return}
  const lanes=v.lanes||[]
  // ── 레인(축) 배치 ──
  if(lanes.length){
    const all=[...lanes,'미배정'], colW=r.width/all.length
    all.forEach((nm,i)=>{
      root.append('text').attr('class','lane-name').attr('x',colW*(i+0.5)).attr('y',24).attr('text-anchor','middle')
        .text(nm+(nm==='미배정'&&!vis.some(n=>!lanes.includes(n.meta.lane))?'':''))
      if(i)root.append('line').attr('class','lane-line').attr('x1',colW*i).attr('x2',colW*i).attr('y1',10).attr('y2',r.height-10)})
    const byLane={}
    vis.forEach(n=>{const l=lanes.includes(n.meta.lane)?n.meta.lane:'미배정';(byLane[l]=byLane[l]||[]).push(n)})
    Object.entries(byLane).forEach(([l,list])=>{
      const ci=all.indexOf(l)
      list.forEach((n,i)=>{if(n.x==null||n.y==null){n.x=colW*(ci+0.5);n.y=r.height*(i+1)/(list.length+1)+30}})})
  }else{
    // ── 자유 배치(force) — 영역(디렉터리 최상위/타입) 군집 ──
    const key=(n)=>n.type==='file'?(n.payload.area||'.'):n.type
    const areas=[...new Set(vis.map(key))]
    const AC={};areas.forEach((a,i)=>{const ang=2*Math.PI*i/areas.length-Math.PI/2
      AC[a]={x:r.width/2+Math.cos(ang)*r.width*.3,y:r.height/2+Math.sin(ang)*r.height*.3}})
    vis.forEach(n=>{if(n.x==null||n.y==null){const c=AC[key(n)]
      n.x=c.x+(HH(n.nid)-.5)*160;n.y=c.y+(HH(n.nid+'#')-.5)*160}})
    const links=visEdges(vis).map(e=>({source:e.s,target:e.t}))
    sim=d3.forceSimulation(vis)
      .force('link',d3.forceLink(links).id(d=>d.nid).distance(l=>{const nn=(x)=>typeof x==='object'?x:byN[x]
        return key(nn(l.source))===key(nn(l.target))?70:230}).strength(.22))
      .force('charge',d3.forceManyBody().strength(-150).distanceMax(420))
      .force('collide',d3.forceCollide().radius(d=>W_(d)/2+8))
      .force('ax',d3.forceX(d=>AC[key(d)].x).strength(.07))
      .force('ay',d3.forceY(d=>AC[key(d)].y).strength(.09))
      .alpha(0.8).alphaDecay(0.04)
    const aLb=root.append('g').selectAll('text').data(areas).join('text')
      .attr('class','area-lb').attr('text-anchor','middle')
      .attr('fill',a=>d3.schemeTableau10[areas.indexOf(a)%10]).text(a=>a)
    sim.on('tick',()=>{draw();areas.forEach(a=>{const g=vis.filter(n=>key(n)===a)
      aLb.filter(x=>x===a).attr('x',d3.mean(g,n=>n.x)).attr('y',d3.min(g,n=>n.y)-28)})})
    sim.on('end',()=>pinsKick())
  }
  // ── 엣지·노드 셀렉션(공통) ──
  const EE=[...visEdges(vis),...(!v.types.includes('file')?aggEdges(vis):[])]
  root.append('g').attr('id','eg')
  root.append('g').attr('id','ng')
  const eSel=root.select('#eg').selectAll('path').data(EE,e=>e.id).join('path')
  const lSel=root.select('#eg').selectAll('text').data(EE.filter(e=>e.label&&e.origin!=='scan'),e=>e.id).join('text').attr('class','edlb').attr('text-anchor','middle').text(e=>e.label)
  const nSel=root.select('#ng').selectAll('g').data(vis,d=>d.nid).join(enter=>{
      const g=enter.append('g')
      g.append('rect')
      g.append('text').attr('class','nm').attr('text-anchor','middle')
      g.append('text').attr('class','st').attr('text-anchor','middle')
      return g})
    .attr('id',d=>domId(d.nid)).attr('data-nid',d=>d.nid)
  nSel.select('rect').attr('rx',d=>d.type==='concept'?13:11).attr('width',d=>W_(d)).attr('height',d=>H_(d))
    .attr('stroke',d=>d.type==='concept'?null:d3.schemeTableau10[[...new Set(vis.map(n=>n.type==='file'?(n.payload.area||'.'):n.type))].indexOf(d.type==='file'?(d.payload.area||'.'):d.type)%10])
  nSel.select('.nm').text(d=>d.name)
  nSel.select('.st').text(d=>d.type==='concept'?statLine(d):(d.type!=='file'?d.type:''))
  function draw(){
    eSel.attr('d',edgeD)
    lSel.attr('x',e=>lbPos(e)[0]).attr('y',e=>lbPos(e)[1])
    nSel.attr('class',d=>ndClass(d)).select('rect').attr('x',d=>d.x-W_(d)/2).attr('y',d=>d.y-H_(d)/2)
    nSel.select('.nm').attr('x',d=>d.x).attr('y',d=>d.y+(d.type==='concept'?-2:3.5))
    nSel.select('.st').attr('x',d=>d.x).attr('y',d=>d.y+15)
    eSel.attr('class',e=>edClass(e))
    lSel.attr('class',e=>'edlb'+(edClass(e).includes('faded')?' faded':''))
  }
  window._draw=draw
  nSel.call(d3.drag()
    .on('start',(ev,d)=>{if(sim&&!ev.active)sim.alphaTarget(.2).restart();if(sim){d.fx=d.x;d.fy=d.y}})
    .on('drag',(ev,d)=>{if(sim){d.fx=ev.x;d.fy=ev.y}else{d.x=ev.x;d.y=ev.y;draw();pinsKick()}})
    .on('end',async(ev,d)=>{
      if(sim){if(!ev.active)sim.alphaTarget(0);d.x=d.fx??d.x;d.y=d.fy??d.y;d.fx=d.fy=null}
      const patch={x:d.x,y:d.y}
      if(lanes.length){                       // 레인 뷰: 드롭한 열로 lane 재배정(플랫폼 기능 사용)
        const all=[...lanes,'미배정'],ci=Math.max(0,Math.min(all.length-1,Math.floor(d.x/(r.width/all.length))))
        const nl=all[ci]==='미배정'?'':all[ci]
        if((d.meta.lane||'')!==nl){d.meta.lane=nl;patch.meta={lane:nl};toast(`레인: ${nl||'미배정'}`)}}
      try{await P(`/nodes/${encodeURIComponent(d.nid)}/`,'PATCH',patch)}catch(e){}
      pinsKick()}))
  nSel.on('click',(ev,d)=>{if(ev.defaultPrevented)return;nodeClick(d)})
  draw();pinsKick()
}
function statLine(d){
  const globs=d.meta.globs||[]
  if(!globs.length)return d.meta.lane||''
  let f=0,loc=0
  G.nodes.forEach(n=>{if(n.type==='file'&&globs.some(g=>n.nid.slice(2).startsWith(g))){f++;loc+=n.payload.loc||0}})
  return `${f}파일 · ${(loc/1000).toFixed(1)}k줄`
}
function ndClass(d){
  const f=S.sel
  const rel=f&&(d.nid===f||G.edges.some(e=>(e.s===f&&e.t===d.nid)||(e.t===f&&e.s===d.nid)))
  const m=S.q&&!(d.name+' '+d.nid).toLowerCase().includes(S.q)
  return `nd t-${d.type} origin-${d.origin}`+(S.sel===d.nid?' sel':'')+(rel&&d.nid!==f?' rel':'')+((m||(f&&!rel))?' faded':'')
}
function edClass(e){
  const f=S.sel,touch=f&&(e.s===f||e.t===f)
  const base=e.origin==='scan'?'scan':e.origin==='agg'?'agg':'user'
  const faded=(f&&!touch)||(S.q&&!(((byN[e.s]||{}).name||'')+((byN[e.t]||{}).name||'')).toLowerCase().includes(S.q))
  return `ed ${base}`+(touch?' hot':'')+(faded?' faded':'')
}

/* ══ 노드 상호작용 — 생성·편집·연결(전부 API 사용) ══ */
async function createNodeAt(x,y){
  const v=curView()
  const type=(v.types[0])||prompt('노드 타입','concept')||'concept'
  const name=prompt(`새 ${type} 노드 이름`);if(!name)return
  try{const n=await P('/nodes/','POST',{type,name,x,y,meta:v.lanes.length?{lane:''}:{}})
    await reload(false);S.sel=n.nid;render();panel();toast('노드 생성')}catch(e){alert(e.message)}
}
svg.on('dblclick',(ev)=>{
  const t=d3.zoomTransform(svg.node())
  const [px,py]=d3.pointer(ev,svg.node())
  createNodeAt((px-t.x)/t.k,(py-t.y)/t.k)
})
function nodeClick(d){
  if(S.linkFrom&&S.linkFrom!==d.nid){finishLink(d);return}
  S.sel=S.sel===d.nid?null:d.nid
  window._draw&&_draw();panel();pinsKick()
}
function startLink(){S.linkFrom=S.sel
  const b=document.getElementById('banner');b.style.display='block'
  b.textContent=`관계 만들기: '${byN[S.linkFrom].name}' → 대상 노드를 클릭 (Esc 취소)`}
async function finishLink(target){
  const label=prompt(`관계 라벨 — ${byN[S.linkFrom].name} → ${target.name}`,'')
  if(label!==null){try{await P('/edges/','POST',{s:S.linkFrom,t:target.nid,label});await reload(false);toast('관계 생성')}catch(e){alert(e.message)}}
  S.linkFrom=null;document.getElementById('banner').style.display='none';render();panel()
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.linkFrom=null;document.getElementById('banner').style.display='none'}})

/* ══ 패널 — 모든 노드가 살아있는 개체(보기+편집+관계) ══ */
function panel(){
  const p=d3.select('#panel'),n=S.sel&&byN[S.sel]
  if(!n){p.style('display','none');return}
  const eds=G.edges.filter(e=>e.s===n.nid||e.t===n.nid)
  const linked=(e)=>{const o=e.s===n.nid?e.t:e.s;return byN[o]}
  const isUser=n.origin==='user'
  p.style('display','block').html(`
    <div class="head"><span>${esc(n.name)}</span><button class="x">×</button></div>
    <div class="path">${esc(n.nid)} · ${esc(n.type)} · ${isUser?'사람이 만듦':'스캔'}${n.type==='file'?` · ${n.payload.loc}줄`:''}</div>
    ${n.type==='file'&&n.payload.doc?`<div class="doc">${esc(n.payload.doc)}</div>`:''}
    ${isUser?`
      <div class="lbl">이름</div><input id="p-name" value="${esc(n.name).replace(/"/g,'&quot;')}" />
      <div class="lbl">타입</div><input id="p-type" value="${esc(n.type)}" />
      <div class="lbl">설명</div><textarea id="p-desc">${esc(n.meta.desc||'')}</textarea>
      <div class="lbl">근거(정본·구술)</div><input id="p-src" value="${esc(n.meta.src||'').replace(/"/g,'&quot;')}" />
      ${curView().lanes.length?`<div class="lbl">레인</div><select id="p-lane"><option value="">미배정</option>${curView().lanes.map(l=>`<option ${n.meta.lane===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
      <div class="lbl">소스 매핑(접두, 줄당 1)</div><textarea id="p-globs">${(n.meta.globs||[]).join('\n')}</textarea>`
    :`<div class="lbl">메모(사람 영역 — 재스캔에도 남음)</div><textarea id="p-note">${esc(n.meta.note||'')}</textarea>
      ${n.meta.desc?`<div class="doc">${esc(n.meta.desc)}</div>`:''}`}
    <div class="row">
      <button class="on" id="p-save">저장</button>
      <button id="p-link">관계 만들기 →</button>
      ${isUser?'<button id="p-del">삭제</button>':''}
    </div>
    <div class="t">관계 (${eds.length})</div>
    ${eds.map(e=>{const o=linked(e);return `<div class="erow"><span>${e.s===n.nid?'→':'←'} ${esc(o?o.name:'?')} ${e.label?`· ${esc(e.label)}`:''} ${e.origin==='scan'?'<span style="opacity:.5">(scan)</span>':''}</span>
      <a data-go="${esc(e.s===n.nid?e.t:e.s)}">보기</a>${e.origin==='user'?`<button data-de="${e.id}">삭제</button>`:''}</div>`}).join('')||'<span class="lbl">없음</span>'}
    ${(n.meta.globs||[]).length?`<div class="t">매핑된 큰 파일</div>${G.nodes.filter(f=>f.type==='file'&&(n.meta.globs||[]).some(g=>f.nid.slice(2).startsWith(g))).sort((a,b)=>(b.payload.loc||0)-(a.payload.loc||0)).slice(0,6).map(f=>`<a data-go="${esc(f.nid)}">${esc(f.nid.slice(2))} · ${f.payload.loc}줄</a>`).join('')}`:''}`)
  p.select('.x').on('click',()=>{S.sel=null;window._draw&&_draw();panel()})
  p.select('#p-save').on('click',async()=>{
    const body={}
    if(isUser){body.name=document.getElementById('p-name').value.trim()
      body.type=document.getElementById('p-type').value.trim()
      const meta={desc:document.getElementById('p-desc').value.trim(),src:document.getElementById('p-src').value.trim(),
        globs:document.getElementById('p-globs').value.split('\n').map(s=>s.trim()).filter(Boolean)}
      const lane=document.getElementById('p-lane');if(lane)meta.lane=lane.value
      body.meta=meta}
    else body.meta={note:document.getElementById('p-note').value.trim()}
    try{await P(`/nodes/${encodeURIComponent(n.nid)}/`,'PATCH',body);await reload(false);render();panel();toast('저장됨')}catch(e){alert(e.message)}})
  p.select('#p-link').on('click',startLink)
  p.select('#p-del').on('click',async()=>{if(!confirm(n.name+' 삭제? (관계 동반 삭제)'))return
    try{await P(`/nodes/${encodeURIComponent(n.nid)}/`,'DELETE');S.sel=null;await reload(false);render();panel()}catch(e){alert(e.message)}})
  p.selectAll('button[data-de]').on('click',async function(){
    try{await P(`/edges/${this.dataset.de}/`,'DELETE');await reload(false);render();panel()}catch(e){alert(e.message)}})
  p.selectAll('a[data-go]').on('click',function(){
    const nid=this.dataset.go,tn=byN[nid]
    if(!inView(tn,curView())){const v=G.views.find(v=>inView(tn,v));if(v)S.view=v.vid}
    S.sel=nid;render();panel()
    const t=d3.zoomTransform(svg.node()),r=svg.node().getBoundingClientRect()
    svg.transition().duration(250).call(zoom.transform,d3.zoomIdentity.translate(r.width/2-tn.x*t.k,r.height/2-tn.y*t.k).scale(t.k))})
}

/* ══ 범례·스캔·부트 ══ */
function legend(){
  const v=curView()
  d3.select('#legend').html(`<b>${esc(v.name)}</b> — ${v.types.length?('타입: '+v.types.join(', ')):'모든 타입'} · ${v.lanes.length?'축(레인) 배치 — 드래그로 열 이동=재배정':'자유 배치(연결이 위치를 만듦)'}<br>
    더블클릭=노드 생성 · 노드 클릭=편집 패널 · 패널→관계 만들기 · 📌=피드백 핀. 보라 선=사람이 선언, 회색=스캔(import)${v.types.includes('file')?'':' · 회색 굵은=개념 간 import 집계'}`)
}
window.doScan=async()=>{const b=document.getElementById('scanBtn');b.disabled=true;b.textContent='스캔 중…'
  try{const r=await P('/scan/','POST');toast(`스캔: +${r.created} ~${r.updated} -${r.removed}`);await reload(false);render()}
  catch(e){alert(e.message)}
  b.disabled=false;b.textContent='재스캔'}
async function reload(first){
  G=await P('/graph/')
  Object.keys(byN).forEach(k=>delete byN[k])
  G.nodes.forEach(n=>{n.meta=n.meta||{};n.payload=n.payload||{};byN[n.nid]=n})
  if(first){const info=await api(`${BASE}api/projects/${SLUG}/`).catch(()=>null)
    d3.select('#pname').text(info?info.name:SLUG);document.title=`${SLUG} — 지도`}
  d3.select('#meta').text(`노드 ${G.nodes.length}(사람 ${G.nodes.filter(n=>n.origin==='user').length}) · 관계 ${G.edges.length} · 뷰 ${G.views.length}`)
  if(!S.view||!G.views.some(v=>v.vid===S.view))S.view=(G.views.find(v=>G.nodes.some(n=>n.origin==='user'&&inView(n,v)))||G.views[0]||{vid:'all'}).vid
}
async function boot(){
  if(!SLUG){d3.select('#meta').text('프로젝트 경로가 아니다(/p/<slug>/)');return}
  await reload(true)
  render()
  d3.select('#q').on('input',function(){S.q=this.value.trim().toLowerCase();window._draw&&_draw()})
  d3.select('#fit').on('click',()=>svg.transition().duration(200).call(zoom.transform,d3.zoomIdentity))
  d3.select('#scanBtn').on('click',doScan)
  window.addEventListener('resize',()=>render())
}
boot().catch(e=>{d3.select('#meta').text('로드 실패: '+e.message+' — admin 토큰 확인')})
</script>
</body>
