<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>피드백 백로그 — dev</title>
<style>
:root{--bg:#0d0d12;--bg2:#16161d;--line:#26262f;--text:#e8e8ef;--text2:#b9b9c6;--text3:#8b8b99;--accent:#7b78f0;--ok:#3f8f5f;--warn:#c9a86a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,'Apple SD Gothic Neo',sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 8px;flex-wrap:wrap}
h1{margin:0;font-size:16px}
.sub{font-size:11.5px;color:var(--text3)}
.tools{display:flex;gap:8px;align-items:center}
select,button{padding:6px 10px;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text2);cursor:pointer}
a.map{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.tabs{display:flex;gap:6px;padding:0 18px 10px}
.tab{padding:6px 12px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;color:var(--text2);cursor:pointer;background:var(--bg2)}
.tab.on{border-color:var(--accent);color:var(--accent)}
.tab b{font-weight:700}
main{display:flex;gap:14px;padding:0 18px 18px;align-items:flex-start}
#list{flex:1;min-width:0}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.item:hover{border-color:var(--accent)}
.item.on{border-color:var(--accent);background:rgba(123,120,240,.07)}
.row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.svc{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text3)}
.svc.codegraph{color:var(--warn);border-color:rgba(201,168,106,.5)}
.route{font-size:11px;color:var(--text3);word-break:break-all}
.el{font-size:11px;color:var(--text2)}
.body{margin:4px 0 2px;white-space:pre-wrap;word-break:break-word}
.meta{font-size:10.5px;color:var(--text3)}
#detail{width:360px;flex:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2);position:sticky;top:12px;display:none;max-height:calc(100vh - 40px);overflow-y:auto}
#detail .body{font-size:13px}
#detail .sec{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
#detail .cm{font-size:12px;padding:4px 0}
#detail .cm .who{color:var(--text3);font-size:10.5px}
#detail input{width:100%;padding:6px 9px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text)}
#detail .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.res{background:rgba(63,143,95,.12);border:1px solid rgba(63,143,95,.4);border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px;white-space:pre-wrap}
.empty{color:var(--text3);padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <div><h1>피드백 백로그 <span class="sub">dev — murmur·코드지도 공용(service 구분)</span></h1></div>
  <div class="tools">
    <select id="svc"><option value="">모든 서비스</option></select>
    <a class="map" href="./codegraph/">코드 지도 →</a>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<main>
  <div id="list"><div class="empty">로딩…</div></div>
  <aside id="detail"></aside>
</main>
<script>
const $=(s)=>document.querySelector(s)
const API='./api/feedback/'
const T={ get(){ let t=localStorage.getItem('organt_token'); if(!t){t=prompt('admin 토큰(organt_token)');if(t)localStorage.setItem('organt_token',t)} return t||'' } }
const hdr=()=>({'Authorization':'Token '+T.get(),'Content-Type':'application/json'})
const S={tab:'open',svc:'',all:[],sel:null}
// 상태(라운드2): open=대기 · resolved/rejected/deferred=처리됨(회신) · closed=완료
const ACTED=['resolved','rejected','deferred']
const TABS=[['open','대기'],['acted','처리됨'],['closed','완료']]
const inTab=(it,t)=>t==='open'?it.status==='open':t==='acted'?ACTED.includes(it.status):it.status==='closed'
const ST_LB={open:'대기',resolved:'처리',rejected:'반려',deferred:'보류',closed:'완료'}
const esc=(s)=>String(s??'').replace(/</g,'&lt;')
const ts=(v)=>{try{return new Date(v*1000).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}

async function jget(u){const r=await fetch(u,{headers:hdr()});if(!r.ok)throw new Error(r.status);return r.json()}
async function jsend(u,m,b){const r=await fetch(u,{method:m,headers:hdr(),body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()}

async function load(){
  try{ S.all=(await jget(API+'?service=all')).items||[] }
  catch(e){ $('#list').innerHTML=`<div class="empty">로드 실패(${e.message}) — admin 토큰 확인. <button onclick="localStorage.removeItem('organt_token');location.reload()">토큰 다시 입력</button></div>`; return }
  renderTabs();renderList()
  const svcs=[...new Set(S.all.map(i=>i.service))]
  const sel=$('#svc'); const cur=sel.value
  sel.innerHTML='<option value="">모든 서비스</option>'+svcs.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('')
}
const filtered=()=>S.all.filter(it=>(!S.svc||it.service===S.svc)&&inTab(it,S.tab))
function renderTabs(){
  const cnt=(t)=>S.all.filter(it=>(!S.svc||it.service===S.svc)&&inTab(it,t)).length
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<div class="tab ${S.tab===k?'on':''}" data-t="${k}">${l} <b>${cnt(k)}</b></div>`).join('')
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.t;S.sel=null;$('#detail').style.display='none';renderTabs();renderList()})
}
function renderList(){
  const L=$('#list'); const items=filtered()
  if(!items.length){L.innerHTML='<div class="empty">비어 있음</div>';return}
  L.innerHTML=items.map(it=>`<div class="item ${S.sel===it.id?'on':''}" data-id="${it.id}">
    <div class="row1"><b>#${it.id}</b><span class="svc ${esc(it.service)}">${esc(it.service)}</span>
      <span class="meta">${ST_LB[it.status]||esc(it.status)}</span>
      <span class="route">${esc(it.route)}</span></div>
    <div class="el">${esc(it.element_label)}</div>
    <div class="body">${esc(it.body)}</div>
    <div class="meta">${esc(it.author)} · ${ts(it.created_at)}</div></div>`).join('')
  document.querySelectorAll('.item').forEach(d=>d.onclick=()=>openDetail(+d.dataset.id))
}
async function openDetail(id){
  S.sel=id;renderList()
  const D=$('#detail');D.style.display='block';D.innerHTML='로딩…'
  let d;try{d=await jget(API+id+'/')}catch(e){D.innerHTML='실패 '+e.message;return}
  const pinLink=d.service==='codegraph'?`<a class="map" style="padding:3px 8px" href="./codegraph/">지도에서 보기</a>`
    :`<a class="map" style="padding:3px 8px" href="${esc(d.route)}?fb=${d.id}" target="_blank">화면에서 보기</a>`
  const acts=[]
  if(ACTED.includes(d.status))acts.push(`<button onclick="act(${d.id},'closed')">완료(닫기)</button>`)
  if(d.status!=='open')acts.push(`<button onclick="act(${d.id},'open')">재오픈</button>`)
  acts.push(`<button onclick="del(${d.id})">삭제</button>`)
  D.innerHTML=`<div class="row1"><b>#${d.id}</b><span class="svc ${esc(d.service)}">${esc(d.service)}</span><span class="meta">${esc(d.status_label||d.status)}</span></div>
    <div class="route">${esc(d.route)} — ${esc(d.element_label)}</div>
    <div class="body">${esc(d.body)}</div>
    <div class="meta">${esc(d.author)} · ${ts(d.created_at)} ${pinLink}</div>
    ${d.resolution?`<div class="res"><b>처리 노트</b> (${esc(d.resolved_by)})\n${esc(d.resolution)}</div>`:''}
    <div class="sec">${(d.comments||[]).map(c=>`<div class="cm"><span class="who">${esc(c.author)}</span> ${esc(c.body)}</div>`).join('')||'<span class="meta">댓글 없음</span>'}</div>
    <input id="cmt" placeholder="댓글(Enter)…" />
    <div class="acts">${acts.join('')}</div>`
  $('#cmt').addEventListener('keydown',async(e)=>{ if(e.key==='Enter'&&e.target.value.trim()){await jsend(API+d.id+'/comments/','POST',{body:e.target.value.trim()});openDetail(id)} })
}
window.act=async(id,status)=>{try{await jsend(API+id+'/','PATCH',{status})}catch(e){alert('실패 '+e.message)};S.sel=null;$('#detail').style.display='none';load()}
window.del=async(id)=>{if(!confirm('#'+id+' 삭제?'))return;try{await jsend(API+id+'/','DELETE')}catch(e){alert('실패 '+e.message)};S.sel=null;$('#detail').style.display='none';load()}
$('#svc').addEventListener('change',e=>{S.svc=e.target.value;renderTabs();renderList()})
load()
</script>
</body>
</html>
