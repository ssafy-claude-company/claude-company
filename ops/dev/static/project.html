<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캔버스 — dev</title>
<style>
:root{--bg:#0d0d12;--bg2:#16161d;--line:#26262f;--text:#e8e8ef;--text2:#b9b9c6;--text3:#8b8b99;--accent:#7b78f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,'Apple SD Gothic Neo',sans-serif}
header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 6px;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:16px}
a{color:var(--accent);text-decoration:none}
h1 a{color:var(--text3);font-weight:400}
main{padding:10px 20px 24px;max-width:1000px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:13px 15px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:14px}
.card .m{font-size:11px;color:var(--text3)}
.card .acts{margin-top:8px;display:flex;gap:6px}
button{padding:5px 9px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text2);cursor:pointer}
.new{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--text3);min-height:90px;font-size:13px}
.empty{color:var(--text3);padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1><a href="../../">프로젝트</a> › <span id="pname">캔버스</span></h1>
  <div><a href="./feedback">백로그 →</a></div>
</header>
<main><div id="list" class="grid"><div class="empty">로딩…</div></div></main>
<script>
const M=location.pathname.match(/^(.*?)p\/([^/]+)\/$/)
const BASE=M?M[1]:'/', SLUG=M?M[2]:''
const $=(s)=>document.querySelector(s)
const T={get(){let t=localStorage.getItem('organt_token');if(!t){t=prompt('admin 토큰(organt_token)');if(t)localStorage.setItem('organt_token',t)}return t||''}}
const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:{'Authorization':'Token '+T.get(),'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined})
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()}
const esc=(s)=>String(s??'').replace(/</g,'&lt;')
async function load(){
  const info=await api(`${BASE}api/projects/${SLUG}/`).catch(()=>null)
  $('#pname').textContent=info?info.name:SLUG
  let cs
  try{cs=(await api(`${BASE}api/projects/${SLUG}/canvases/`)).canvases}
  catch(e){$('#list').innerHTML=`<div class="empty">로드 실패(${esc(e.message)})</div>`;return}
  $('#list').innerHTML=cs.map(c=>`<div class="card" onclick="location.href='./c/${c.cid}/'">
      <h3>${esc(c.name)}</h3><div class="m">객체 ${c.items} · ${c.updated}</div>
      <div class="acts"><button onclick="event.stopPropagation();ren('${c.cid}','${esc(c.name)}')">이름</button>
      <button onclick="event.stopPropagation();del('${c.cid}')">삭제</button></div></div>`).join('')
    +`<div class="card new" id="new">+ 새 캔버스</div>`
  $('#new').onclick=async()=>{const c=await api(`${BASE}api/projects/${SLUG}/canvases/`,'POST',{name:'새 캔버스'});location.href=`./c/${c.cid}/`}
}
window.ren=async(cid,cur)=>{const n=prompt('캔버스 이름',cur);if(n===null)return
  await api(`${BASE}api/projects/${SLUG}/canvases/${cid}/`,'PATCH',{name:n});load()}
window.del=async(cid)=>{if(!confirm('캔버스 삭제? 위 객체도 지워짐'))return
  await api(`${BASE}api/projects/${SLUG}/canvases/${cid}/`,'DELETE');load()}
load()
</script>
<script>window.FB_SERVICE=SLUG;window.FB_API=BASE+'api/feedback/'</script>
<script>const _fb=document.createElement('script');_fb.src=BASE+'static/fb.js';document.body.appendChild(_fb)</script>
</body>
</html>
