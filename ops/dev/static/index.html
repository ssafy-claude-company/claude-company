<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dev — 프로젝트</title>
<style>
:root{--bg:#0d0d12;--bg2:#16161d;--line:#26262f;--text:#e8e8ef;--text2:#b9b9c6;--text3:#8b8b99;--accent:#7b78f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,'Apple SD Gothic Neo',sans-serif}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px 6px;flex-wrap:wrap}
h1{margin:0;font-size:17px}
.sub{font-size:11.5px;color:var(--text3)}
a{color:var(--accent);text-decoration:none}
main{padding:10px 20px 24px;max-width:1100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:13px 15px}
.card h3{margin:0 0 2px;font-size:14.5px}
.card .path{font-size:10.5px;color:var(--text3);word-break:break-all}
.card .stats{font-size:12px;color:var(--text2);margin:8px 0}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
button{padding:6px 10px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text2);cursor:pointer}
button.pri{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
#reg{border:1px dashed var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
#reg input{padding:6px 9px;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text);margin:2px 6px 2px 0}
#reg .hint{font-size:10.5px;color:var(--text3);margin-top:4px}
.empty{color:var(--text3);padding:40px;text-align:center}
.err{color:#e05c5c}
</style>
</head>
<body>
<header>
  <div>
    <h1>dev — 프로젝트 <span class="sub">메타 서비스: 등록된 모든 프로젝트에 코드 지도·논리층·피드백 핀</span></h1>
  </div>
  <div><a href="./feedback">전체 백로그 →</a></div>
</header>
<main>
  <div id="list" class="grid"><div class="empty">로딩…</div></div>
  <div id="reg">
    <b>프로젝트 등록</b> — claude company가 만든 product(봇 산출물 포함) 무엇이든.
    <div style="margin-top:6px">
      <input id="r-name" placeholder="이름" style="width:200px" />
      <input id="r-slug" placeholder="slug(소문자-하이픈)" style="width:170px" />
      <input id="r-root" placeholder="스캔 루트 경로(VPS)" style="width:330px" />
      <button class="pri" id="r-go">등록+첫 스캔</button>
    </div>
    <div class="hint">등록하면 피드백 service 슬러그도 같은 이름으로 잡힌다. 제외 경로는 등록 후 API로 조정.</div>
  </div>
</main>
<script>
const $=(s)=>document.querySelector(s)
const T={get(){let t=localStorage.getItem('organt_token');if(!t){t=prompt('admin 토큰(organt_token)');if(t)localStorage.setItem('organt_token',t)}return t||''}}
const hdr=()=>({'Authorization':'Token '+T.get(),'Content-Type':'application/json'})
const api=async(u,m,b)=>{const r=await fetch(u,{method:m||'GET',headers:hdr(),body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()}
const esc=(s)=>String(s??'').replace(/</g,'&lt;')

async function load(){
  let d
  try{d=await api('./api/projects/')}
  catch(e){$('#list').innerHTML=`<div class="empty err">로드 실패(${esc(e.message)}) — <button onclick="localStorage.removeItem('organt_token');location.reload()">토큰 다시</button></div>`;return}
  const ps=d.projects
  if(!ps.length){$('#list').innerHTML='<div class="empty">아직 프로젝트가 없다 — 아래에서 등록.</div>';return}
  $('#list').innerHTML=ps.map(p=>`<div class="card">
    <h3><a href="./p/${p.slug}/">${esc(p.name)}</a></h3>
    <div class="path">${esc(p.root)}</div>
    <div class="stats">캔버스 ${p.canvases} · ${p.last_scan?`${p.last_scan.files}파일 스캔됨`:'스캔 없음'}</div>
    <div class="acts">
      <a href="./p/${p.slug}/"><button class="pri">캔버스</button></a>
      <a href="./p/${p.slug}/feedback"><button>백로그</button></a>
      <button onclick="rescan('${p.slug}',this)">재스캔</button>
      <button onclick="del('${p.slug}')">제거</button>
    </div></div>`).join('')
}
window.rescan=async(slug,btn)=>{btn.disabled=true;btn.textContent='스캔 중…'
  try{const r=await api(`./api/projects/${slug}/scan/`,'POST');btn.textContent=`완료(${r.files}파일)`}
  catch(e){btn.textContent='실패';alert(e.message)}
  setTimeout(load,600)}
window.del=async(slug)=>{if(!confirm(slug+' 제거? (스캔·논리층 삭제 — 피드백 핀은 남음)'))return
  try{await api(`./api/projects/${slug}/`,'DELETE')}catch(e){alert(e.message)};load()}
$('#r-go').onclick=async()=>{
  const b={name:$('#r-name').value.trim(),slug:$('#r-slug').value.trim(),root:$('#r-root').value.trim()}
  if(!b.name||!b.root)return alert('이름·루트가 필요')
  try{const p=await api('./api/projects/','POST',b);await api(`./api/projects/${p.slug}/scan/`,'POST')}
  catch(e){return alert(e.message)}
  $('#r-name').value=$('#r-slug').value=$('#r-root').value='';load()}
load()
</script>
<script>window.FB_SERVICE='dev';window.FB_API=location.pathname.replace(/[^/]*$/,'')+'api/feedback/'</script>
<script src="./static/fb.js"></script>
</body>
</html>
