# Codex Remote SSH 하드닝 템플릿.
# 공개키 전용 접속을 별도 터미널에서 검증한 뒤
# /etc/ssh/sshd_config.d/00-codex-remote.conf 로 설치한다.
#
# 00- 접두가 중요하다. OpenSSH는 먼저 읽은 단일값을 사용하므로,
# cloud-init의 50-cloud-init.conf(PasswordAuthentication yes)보다 앞서야 한다.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

