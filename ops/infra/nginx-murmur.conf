server {
    server_name murmur-ai.duckdns.org;
    client_max_body_size 25m;
    # [H3] guide_bridge는 러너(127.0.0.1 직결)만 씀 — 외부 접근 차단(토큰 유출시 원격 악용 방지)
    location /api/guide/ { deny all; return 403; }
    # [C1 차단(2026-07-18)] atelier work 훅 = 무인증 외부 주입(시크릿 기본값 '!'). 러너가 집는
    # request/kind=W 카드 생성 → 봇 임의 실행. atelier는 localhost 직결이라 외부만 차단.
    location /api/atelier/ { deny all; return 403; }
    location /dev/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # [Codex 폐기(2026-07-18)] /codex/->ttyd(7681) 프록시 제거 — 7681 기동 시 공개 무인증 root 셸(잠복 치명).

    # [M2] Django admin — IP당 rate-limit(브루트포스 억제). 나머지는 아래 location /와 동일.
    location /admin/ {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/45.76.226.111.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/45.76.226.111.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = 45.76.226.111.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = murmur-ai.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name murmur-ai.duckdns.org;
    return 404; # managed by Certbot




}