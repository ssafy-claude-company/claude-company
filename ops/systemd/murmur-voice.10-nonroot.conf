# [SFU도 root였다(2026-08-06 감사, 현준-4)] 미디어 중계에 root가 필요하지 않다. 설정 파일은
# 이 사용자만 읽도록 그룹을 좁혔다(/etc/livekit.yaml 640 root:livekit).
# UDP 50000-50100·TCP 7881은 1024 위라 특권이 필요 없다. 되돌리려면 이 파일만 지운다.
[Service]
User=livekit
Group=livekit
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
