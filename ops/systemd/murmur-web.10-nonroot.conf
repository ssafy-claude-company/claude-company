# [웹이 root로 돌고 있었다(2026-08-06 감사, 현준-4 — 사용자 지시)] Django가 모든 요청을 root로
# 처리했다. 우리 코드나 의존성에 원격 실행 결함이 하나 생기면 그것이 곧 서버 장악이 된다.
# 전용 사용자로 낮춘다 — organt(러너)가 아니라 별도 사용자다: organt에게 env를 열면 러너가
# 금고 열쇠를 갖게 되고, 그 성질(engine_resolve: "러너는 금고 열쇠를 갖지 않는다")이 깨진다.
# 되돌리려면 이 파일만 지우고 daemon-reload + restart.
[Service]
User=murmurweb
Group=murmurweb
NoNewPrivileges=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
