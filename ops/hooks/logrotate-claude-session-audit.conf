# 세션 귀속 기록 로테이션 (2026-07-31, 현준-4)
#
# 이 파일은 chattr +a(추가 전용)로 잠겨 있다. 세션이 지난 줄을 못 고치게 하려는 것인데,
# 그 속성 때문에 보통의 로테이션(rename + 새 파일)이 실패한다. 속성을 잠깐 벗기고
# 돌린 뒤 다시 거는 절차가 필요하다 - root만 할 수 있다(CAP_LINUX_IMMUTABLE).
#
# 벗겨진 창이 짧을수록 좋다. prerotate에서 벗기고 postrotate에서 곧바로 다시 건다.
/var/log/claude-session-audit.jsonl {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
    prerotate
        /usr/bin/chattr -a /var/log/claude-session-audit.jsonl 2>/dev/null || true
    endscript
    postrotate
        /usr/bin/chattr +a /var/log/claude-session-audit.jsonl 2>/dev/null || true
        # 회전본을 root 전용 읽기로 못박는다. copytruncate는 소유자를 그대로 물려주는데,
        # 그러면 세션(dojin)이 지난 기록을 고칠 수 있다 - 살아 있는 파일만 잠그고 지난
        # 것을 열어두면 잠근 의미가 없다.
        for f in /var/log/claude-session-audit.jsonl.[0-9]*; do
            [ -e "$f" ] || continue
            /bin/chown root:root "$f" 2>/dev/null || true
            /bin/chmod 0400 "$f" 2>/dev/null || true
        done
    endscript
}
